[package]
name = "plinth-sync"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
automerge = "0.12"
if-addrs = "0.15"
mdns-sd = "0.20"
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
rusqlite = { version = "0.39", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
