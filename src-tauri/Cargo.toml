[package]
authors = ["Andrei Sousa"]
default-run = "desktop"
description = "A Tauri App"
edition = "2024"
name = "desktop"
version = "0.1.0"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]
name = "desktop_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "time",
] }

# SQLite — async pool with compile-time checked queries
sqlx = { version = "0.9.0", features = [
    "sqlite",
    "runtime-tokio",
    "macros",
    "migrate",
] }

# Error handling
thiserror = "2"

# Password hashing
rust-argon2 = "3.0.0"

# Random salt generation
getrandom = "0.4.3"

# UUIDs for generated IDs
uuid = { version = "1.23", features = ["v4"] }

# P2P sync — local network discovery
gethostname = "1"
mdns-sd = "0.21"

# Date/time formatting
chrono = { version = "0.4.45", features = ["serde"] }

# Import pipeline
boa_engine = "0.22"
calamine = { version = "0.36.0", features = ["dates"] }
csv = "1"
md-5 = "0.11.0"
pdf-extract = "0.12.0"
tauri-plugin-dialog = "2"

# Model inference
# WGPU provides a cross-platform GPU backend, using platform APIs such as
# DirectX, Vulkan, and Metal without requiring CUDA Toolkit.
burn = { version = "~0.21", default-features = false, features = [
    "autotune",
    "fusion",
    "metal",
    "std",
    "store",
    "train",
    "webgpu",
] }
burn-store = { version = "~0.21", default-features = false, features = ["std", "safetensors", "burnpack", "memmap"] }
hf-hub = { version = "1.0.0" }
tokenizers = "0.23.1"

# For the passsword-authenticated key exchange (PAKE) protocol used in the P2P sync.
chacha20poly1305 = "0.11"
postcard = { version = "1", features = ["alloc"] }
rcgen = "0.14.8"
rustls-pemfile = "2"
spake2 = "0.4"
tauri-plugin-updater = "2.10.1"
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
] }
